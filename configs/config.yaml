paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  features_dir: "data/features"
  errors_dir: "data/errors"
  models_dir: "models"
  reports_dir: "reports"

ingestion:
  url: "https://files.grouplens.org/datasets/movielens/ml-100k.zip"

validation:
  rating_min: 1.0
  rating_max: 5.0

preparation:
  train_split_ratio: 0.80

models:
  baseline_popularity:
    top_k: 10
  matrix_factorization_svd:
    n_factors: 32
    learning_rate: 0.005
    reg: 0.02
    n_epochs: 10
    random_state: 42

evaluation:
  k_list: [5, 10]
  relevance_threshold: 3.5

mlflow:
  experiment_name: "recommender_system_pipeline"
  tracking_uri: "sqlite:///mlflow.db"
